# EmbodiedCoop four-scene eval config.
# Pass this file to eval/eval_embodiedcoop.py with --config-file.
# Command-line arguments override values in this file.

# Supported agent modes: embodiedcoop
agent_mode: embodiedcoop

# Supported scenes:
# - hotel_housekeeping
# - facility_inspection
# - restaurant_serving
# - restocking
scene: hotel_housekeeping

# Select one bundle id from tasks/manifest.json.
# You can also override from CLI:
#   --scene restocking --bundle-id req3_restocking_sum03_bundle_000000
bundle_id: req1_bathroom_FloorPlan402_1221

# Four-scene bundle metadata. eval_embodiedcoop.py reads this file to fill:
# task_json, request_bundle_dir, request_bundle_file_prefix, robot_team_preset,
# log_skill_name, request_type, active_skill, request_delivery_mode,
# initial_request_count, request_injection_interval_rounds, and request_injection_batch_size.
eval_bundles_file: tasks/manifest.json

# Model and execution budget.
model: gemini-3-flash-preview-high
max_iterations: auto

# Memory ablations.
ablate_all_memory: false
ablate_agent_memory: false

